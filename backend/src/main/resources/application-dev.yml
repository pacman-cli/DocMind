spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dockmind_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.dockmind: DEBUG
    org.springframework.web: INFO
